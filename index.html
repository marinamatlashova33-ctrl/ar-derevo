<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AR — Дерево ИИ нашего ателье</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}
#tip{position:fixed;z-index:5;top:12px;left:5%;width:90%;box-sizing:border-box;background:rgba(255,255,255,.94);padding:12px 14px;border-radius:14px;text-align:center;color:#245136;font-weight:700;font-size:14px;pointer-events:none}
</style>
</head>
<body>
<div id="tip">🌳 Разрешите камеру и наведите её на плакат «Дерево ИИ»</div>
<a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" embedded color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
<a-entity id="target" mindar-image-target="targetIndex: 0">
  <!-- A raised 3D branch appears anchored to the recognized poster. -->
  <a-cylinder position="0.08 0.02 0.13" radius="0.018" height="0.45" rotation="0 0 -58" color="#745036"></a-cylinder>
  <a-entity id="leaf" position="0.19 0.14 0.17" scale="0 0 0">
    <a-sphere color="#6eac43" scale="0.12 0.22 0.035" rotation="0 0 -35" roughness="0.7"></a-sphere>
    <a-sphere color="#a7d86c" position="0.012 0.012 0.02" scale="0.08 0.15 0.012" rotation="0 0 -35"></a-sphere>
    <a-animation attribute="rotation" from="0 0 -5" to="0 0 5" dur="1900" direction="alternate" repeat="indefinite"></a-animation>
  </a-entity>
</a-entity>
</a-scene>
<script>
const target=document.querySelector('#target');
const leaf=document.querySelector('#leaf');
const tip=document.querySelector('#tip');
target.addEventListener('targetFound',()=>{
 tip.textContent='🍃 Дерево оживает — появился первый листочек!';
 leaf.removeAttribute('animation__grow');
 leaf.setAttribute('scale','0 0 0');
 leaf.setAttribute('animation__grow','property: scale; to: 1 1 1; dur: 1600; easing: easeOutElastic');
});
target.addEventListener('targetLost',()=>{tip.textContent='🌳 Наведите камеру обратно на плакат';});
</script>
</body>
</html>
