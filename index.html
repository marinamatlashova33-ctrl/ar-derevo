<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>AR — Дерево ИИ нашего ателье</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#tip{
  position:fixed;
  z-index:5;
  top:12px;
  left:5%;
  width:90%;
  box-sizing:border-box;
  background:rgba(255,255,255,.94);
  padding:12px 14px;
  border-radius:14px;
  text-align:center;
  color:#245136;
  font-weight:700;
  font-size:14px;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="tip">
🌳 Разрешите камеру и наведите её на плакат «Дерево ИИ»
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  embedded
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- Реалистичная модель дерева -->
  <a-assets timeout="60000">
    <a-asset-item
      id="treeModel"
      src="./realistic_tree_AR_optimized.glb">
    </a-asset-item>
  </a-assets>

  <!-- Рабочую камеру не меняем -->
  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <!-- Наш проверенный AR-маркер -->
  <a-entity
    id="target"
    mindar-image-target="targetIndex: 0">

    <!-- Настоящее 3D-дерево -->
    <a-gltf-model
      id="realTree"
      src="#treeModel"
      position="0 -0.35 0.08"
      rotation="0 0 0"
      scale="0 0 0">
    </a-gltf-model>

  </a-entity>

</a-scene>

<script>
const target = document.querySelector('#target');
const tree = document.querySelector('#realTree');
const tip = document.querySelector('#tip');

target.addEventListener('targetFound', () => {

  tip.textContent = '🌿 Дерево ИИ оживает!';

  tree.removeAttribute('animation__grow');

  tree.setAttribute('scale', '0 0 0');

  tree.setAttribute(
    'animation__grow',
    'property: scale; to: 0.45 0.45 0.45; dur: 1800; easing: easeOutElastic'
  );
});

target.addEventListener('targetLost', () => {
  tip.textContent = '🌳 Наведите камеру обратно на плакат';
});
</script>

</body>
  </html>
